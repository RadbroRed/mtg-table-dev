name: Deploy to Fly.io

# local -> git push -> GitHub Actions -> fly.dev
#
# Two environments, chosen by branch:
#   main -> the-crypto-game       (stable)
#   dev  -> the-crypto-game-dev (dev)
#
# They are separate Fly apps with separate volumes, so dev deploys can never
# touch stable players, accounts, tables or sessions. Promote by merging
# dev -> main.
#
# The build runs on Fly's own builders (`--remote-only`), so this workflow
# needs no Docker daemon, no buildx, and no qemu on the runner. The 90MB
# image is assembled on Fly's side and only the finished layers come back.

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to deploy
        type: choice
        options: [stable, dev]
        default: stable

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # On a push the branch decides. workflow_dispatch has no branch, so the
    # chosen input decides. Each condition is fully parenthesised because && and
    # || in GitHub expressions are left-associative, and an unparenthesised
    # (a && b) || c && 'name' parses as (a && b) || (c && 'name'), which yields
    # the bare boolean true instead of an app name.
    env:
      STABLE: >-
        ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main')
            || (github.event_name == 'workflow_dispatch' && inputs.environment == 'stable'))
            && 'true' || 'false' }}
      FLY_APP_NAME: >-
        ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main')
            || (github.event_name == 'workflow_dispatch' && inputs.environment == 'stable'))
            && 'the-crypto-game' || 'the-crypto-game-dev' }}
      FLY_HOST: >-
        ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main')
            || (github.event_name == 'workflow_dispatch' && inputs.environment == 'stable'))
            && 'the-crypto-game.fly.dev' || 'the-crypto-game-dev.fly.dev' }}

    # One deploy at a time per app, so a dev deploy never queues behind
    # stable. Do not cancel in progress: each app is a single machine with a
    # volume attached, so killing a deploy halfway would leave the machine
    # updating while the next one starts.
    concurrency:
      group: fly-deploy-${{ inputs.environment || (github.ref == 'refs/heads/main' && 'stable' || 'dev') }}
      cancel-in-progress: false

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        id: deploy
        run: |
          echo "environment: $FLY_APP_NAME"
          echo "hostname:    https://$FLY_HOST"
          flyctl deploy --remote-only --app "$FLY_APP_NAME"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # The catalog is ~70MB of JSON parsed at boot, so the app needs a while
      # before it answers. Retry rather than fail the run on a slow start.
      - name: Wait for the app to serve
        run: |
          for i in $(seq 1 20); do
            if curl -sf --max-time 10 "https://$FLY_HOST/api/info" -o /tmp/info.json; then
              echo "app is up after ~$((i * 5))s"
              cat /tmp/info.json
              exit 0
            fi
            echo "attempt $i: not up yet, waiting…"
            sleep 5
          done
          echo "::error::$FLY_APP_NAME did not become healthy within 100s"
          flyctl logs --app "$FLY_APP_NAME" | tail -50
          exit 1

      - name: Confirm the catalog loaded
        run: |
          cards=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/info.json","utf8")).cardCount)')
          echo "card catalog: $cards cards"
          if [ "$cards" -lt 30000 ]; then
            echo "::error::catalog looks truncated ($cards cards, expected >30000)"
            exit 1
          fi

      - name: Confirm the WebSocket upgrades through the proxy
        # The whole reason this app cannot live on a serverless platform. If
        # Fly's proxy ever stops forwarding the upgrade, this is what catches
        # it, because /api/info stays green either way.
        run: |
          npm install --no-save ws >/dev/null 2>&1
          node -e '
            const WebSocket = require("ws");
            const ws = new WebSocket("wss://'"$FLY_HOST"'/ws");
            const t = setTimeout(() => { console.error("no upgrade"); process.exit(1); }, 20000);
            ws.on("open", () => { clearTimeout(t); console.log("wss upgrade ok"); ws.close(); process.exit(0); });
            ws.on("error", (e) => { clearTimeout(t); console.error("wss failed:", e.message); process.exit(1); });
          '
