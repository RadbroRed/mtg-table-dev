name: Deploy to Fly.io

# local -> git push -> GitHub Actions -> fly.dev
#
# The build runs on Fly's own builders (`--remote-only`), so this workflow
# needs no Docker daemon, no buildx, and no qemu on the runner. The 90MB
# image is assembled on Fly's side and only the finished layers come back.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. Do not cancel in progress: the app is a single
# machine with a volume attached, so killing a deploy halfway would leave the
# machine updating while the next one starts.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

env:
  FLY_APP_NAME: mtg-table-dev
  FLY_HOST: mtg-table-dev.fly.dev

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        id: deploy
        run: flyctl deploy --remote-only --app "$FLY_APP_NAME"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # The catalog is ~70MB of JSON parsed at boot, so the app needs a while
      # before it answers. Retry rather than fail the run on a slow start.
      - name: Wait for the app to serve
        run: |
          for i in $(seq 1 20); do
            if curl -sf --max-time 10 "https://$FLY_HOST/api/info" -o /tmp/info.json; then
              echo "app is up after ~$((i * 5))s"
              cat /tmp/info.json
              exit 0
            fi
            echo "attempt $i: not up yet, waiting…"
            sleep 5
          done
          echo "::error::app did not become healthy within 100s"
          flyctl logs --app "$FLY_APP_NAME" | tail -50
          exit 1

      - name: Confirm the catalog loaded
        run: |
          cards=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("/tmp/info.json","utf8")).cardCount)')
          echo "card catalog: $cards cards"
          if [ "$cards" -lt 30000 ]; then
            echo "::error::catalog looks truncated ($cards cards, expected >30000)"
            exit 1
          fi

      - name: Confirm the WebSocket upgrades through the proxy
        # The whole reason this app cannot live on a serverless platform. If
        # Fly's proxy ever stops forwarding the upgrade, this is what catches
        # it, because /api/info stays green either way.
        run: |
          npm install --no-save ws >/dev/null 2>&1
          node -e '
            const WebSocket = require("ws");
            const ws = new WebSocket("wss://'"$FLY_HOST"'/ws");
            const t = setTimeout(() => { console.error("no upgrade"); process.exit(1); }, 20000);
            ws.on("open", () => { clearTimeout(t); console.log("wss upgrade ok"); ws.close(); process.exit(0); });
            ws.on("error", (e) => { clearTimeout(t); console.error("wss failed:", e.message); process.exit(1); });
          '
